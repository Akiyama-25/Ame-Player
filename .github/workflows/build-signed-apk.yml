name: Build Signed APK

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'references/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test release variant
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android Platform SDK 37
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f -print -quit || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/tools/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          if "$SDKMANAGER" --install "platforms;android-37" > /tmp/sdk.log 2>&1; then
            echo "Installed platforms;android-37 directly"
          else
            echo "Direct install of android-37 failed, trying platforms;android-37.0"
            "$SDKMANAGER" --install "platforms;android-37.0" > /tmp/sdk.log 2>&1 || {
              cat /tmp/sdk.log
              exit 1
            }
            P37="${ANDROID_HOME}/platforms/android-37"
            P370="${ANDROID_HOME}/platforms/android-37.0"
            if [ -d "$P370" ] && [ ! -d "$P37" ]; then
              cp -r "$P370" "$P37"
              sed -i 's/PlatformVersion=37\.0/PlatformVersion=37/' "$P37/source.properties" || true
              sed -i 's/AndroidVersion.ApiLevel=37\.0/AndroidVersion.ApiLevel=37/' "$P37/source.properties" || true
            fi
          fi
          ls -la "${ANDROID_HOME}/platforms/"

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Assemble universal release APKs (standard and disguised variants)
        run: |
          set -euo pipefail
          mkdir -p build-outputs

          # 1. Standard universal APK (unmasked, package: Akari.NCM.player)
          echo ">>> Building standard universal APK..."
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/*.apk build-outputs/app-release-unsigned.apk
          rm -rf app/build/outputs/apk/release/*

          # 2. Apple Music disguise (package: com.apple.android.music)
          echo ">>> Building Apple Music disguise APK..."
          ./gradlew assembleRelease -PcustomApplicationId=com.apple.android.music --no-daemon --stacktrace
          cp app/build/outputs/apk/release/*.apk build-outputs/app-Apple_Music-release-unsigned.apk
          rm -rf app/build/outputs/apk/release/*

          # 3. Spotify disguise (package: com.spotify.music)
          echo ">>> Building Spotify disguise APK..."
          ./gradlew assembleRelease -PcustomApplicationId=com.spotify.music --no-daemon --stacktrace
          cp app/build/outputs/apk/release/*.apk build-outputs/app-Spotify-release-unsigned.apk
          rm -rf app/build/outputs/apk/release/*

          # 4. NetEase Music disguise (package: com.netease.cloudmusic)
          echo ">>> Building NetEase Music disguise APK..."
          ./gradlew assembleRelease -PcustomApplicationId=com.netease.cloudmusic --no-daemon --stacktrace
          cp app/build/outputs/apk/release/*.apk build-outputs/app-Netease_Music-release-unsigned.apk
          rm -rf app/build/outputs/apk/release/*

          # Collect all universal APKs
          cp build-outputs/*.apk app/build/outputs/apk/release/
          ls -lh app/build/outputs/apk/release/

      - name: Verify universal release APKs exist
        run: |
          set -euo pipefail
          ls -lh app/build/outputs/apk/release/
          test -f app/build/outputs/apk/release/app-release-unsigned.apk
          test -f app/build/outputs/apk/release/app-Apple_Music-release-unsigned.apk
          test -f app/build/outputs/apk/release/app-Spotify-release-unsigned.apk
          test -f app/build/outputs/apk/release/app-Netease_Music-release-unsigned.apk

      - name: Upload unsigned APK (PR validation / fallback)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ame-player-unsigned-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload release APK for signing
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 1

  sign:
    name: Sign and verify APK
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Download unsigned APK
        uses: actions/download-artifact@v4
        with:
          name: unsigned-release-apk
          path: unsigned

      - name: Prepare private signing key
        id: prepare-key
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::Missing SIGNING_KEYSTORE_BASE64 secret. Skipping APK signing and retaining unsigned release APK."
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/ame-player-signing.p12"
          test -s "$RUNNER_TEMP/ame-player-signing.p12"
          : "${STORE_PASSWORD:?Missing SIGNING_STORE_PASSWORD secret}"
          : "${KEY_ALIAS:?Missing SIGNING_KEY_ALIAS secret}"
          keytool -list -storetype PKCS12 -keystore "$RUNNER_TEMP/ame-player-signing.p12" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "KEYSTORE_PATH=$RUNNER_TEMP/ame-player-signing.p12" >> "$GITHUB_ENV"
          echo "has_key=true" >> "$GITHUB_OUTPUT"

      - name: Align, sign, and verify APKs
        if: steps.prepare-key.outputs.has_key == 'true'
        env:
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          set -euo pipefail
          : "${STORE_PASSWORD:?Missing SIGNING_STORE_PASSWORD secret}"
          KEY_PASSWORD="${KEY_PASSWORD:-$STORE_PASSWORD}"
          KEY_ALIAS="${KEY_ALIAS:-key0}"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          shopt -s nullglob
          APKS=(unsigned/*.apk)
          test "${#APKS[@]}" -gt 0
          mkdir -p signed
          : > signed/SHA256SUMS.txt
          for APK in "${APKS[@]}"; do
            BASENAME="$(basename "$APK")"
            if [ "$BASENAME" = "app-release-unsigned.apk" ]; then
              SIGNED_NAME="ame-player-release-signed.apk"
            elif [ "$BASENAME" = "app-Apple_Music-release-unsigned.apk" ]; then
              SIGNED_NAME="ame-player-Apple_Music-release-signed.apk"
            elif [ "$BASENAME" = "app-Spotify-release-unsigned.apk" ]; then
              SIGNED_NAME="ame-player-Spotify-release-signed.apk"
            elif [ "$BASENAME" = "app-Netease_Music-release-unsigned.apk" ]; then
              SIGNED_NAME="ame-player-Netease_Music-release-signed.apk"
            else
              VARIANT="${BASENAME#app-}"
              VARIANT="${VARIANT%-unsigned.apk}"
              VARIANT="${VARIANT%.apk}"
              SIGNED_NAME="ame-player-${VARIANT}-signed.apk"
            fi
            ALIGNED="signed/aligned-temp.apk"
            SIGNED="signed/${SIGNED_NAME}"
            "$BUILD_TOOLS/zipalign" -f -p 4 "$APK" "$ALIGNED"
            "$BUILD_TOOLS/apksigner" sign \
              --ks "$KEYSTORE_PATH" \
              --ks-type PKCS12 \
              --ks-pass env:STORE_PASSWORD \
              --key-pass env:KEY_PASSWORD \
              --ks-key-alias "$KEY_ALIAS" \
              --out "$SIGNED" "$ALIGNED"
            "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$SIGNED"
            rm -f "$ALIGNED"
            (cd signed && sha256sum "$SIGNED_NAME" | tee -a SHA256SUMS.txt)
          done

      - name: Upload signed APK artifacts (all variants)
        if: steps.prepare-key.outputs.has_key == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ame-player-release-signed-${{ github.run_number }}
          path: |
            signed/*.apk
            signed/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload unsigned release APK (fallback when secrets unset)
        if: steps.prepare-key.outputs.has_key != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ame-player-release-unsigned-${{ github.run_number }}
          path: unsigned/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary keystore
        if: always()
        run: rm -f "${{ runner.temp }}/ame-player-signing.p12"