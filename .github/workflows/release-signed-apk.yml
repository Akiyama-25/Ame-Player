name: Publish Signed APK Release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: Version tag to build and publish (for example release-0.2 or v1.0.0)
        required: true
        type: string
      use_current_ref:
        description: Build from the dispatched branch/ref even if the tag already exists (for overwriting an existing release)
        required: false
        default: false
        type: boolean
      preserve_release_notes:
        description: Keep existing release notes unchanged when overwriting an existing release
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  wake-runner:
    name: Wake InstaBox Runner
    runs-on: ubuntu-latest
    steps:
      - name: Wake runami machine via InstaBox API
        continue-on-error: true
        env:
          INSTABOX_API_KEY: ${{ secrets.INSTABOX_API_KEY }}
        run: |
          if [ -n "$INSTABOX_API_KEY" ]; then
            echo ">>> Sending wake request to InstaBox for runami (m_agqzg6p6up64vdycn4j2n4kpyu)..."
            curl -s -X POST "https://api.instabox.sh/v1/machines/m_agqzg6p6up64vdycn4j2n4kpyu/wake" \
              -H "Authorization: Bearer $INSTABOX_API_KEY" || true
            echo ">>> Waiting 12s for runner daemon to connect..."
            sleep 12
          else
            echo "INSTABOX_API_KEY is not set, skipping wake."
          fi

  build-sign:
    name: Build and sign release APK
    needs: wake-runner
    outputs:
      tag: ${{ steps.ref.outputs.tag }}
      safe_tag: ${{ steps.ref.outputs.safe_tag }}
      commit_branch: ${{ steps.source_meta.outputs.commit_branch }}
      commit_sha: ${{ steps.source_meta.outputs.commit_sha }}
    runs-on: [self-hosted, android-builder]
    steps:
      - name: Select release ref
        id: ref
        env:
          INPUT_TAG: ${{ inputs.tag_name }}
          EVENT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_TAG" ]; then
            TAG="${INPUT_TAG#refs/tags/}"
          else
            TAG="${EVENT_REF#refs/tags/}"
          fi
          if [ -z "$TAG" ]; then
            echo "::error::Tag name cannot be empty"
            exit 1
          fi
          SAFE_TAG="$(printf '%s' "$TAG" | tr '/ :' '---')"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "safe_tag=$SAFE_TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout target tag if it exists and resolve commit branch
        id: source_meta
        env:
          TARGET_TAG: ${{ steps.ref.outputs.tag }}
          USE_CURRENT_REF: ${{ inputs.use_current_ref }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF_NAME: ${{ github.ref_name }}
          EVENT_REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'

          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$USE_CURRENT_REF" = "true" ]; then
            echo "use_current_ref=true: building from dispatched ref ($EVENT_REF_NAME @ $(git rev-parse --short HEAD)) for tag '$TARGET_TAG'."
          elif git rev-parse -q --verify "refs/tags/$TARGET_TAG" >/dev/null; then
            echo "Checking out existing tag: $TARGET_TAG"
            git checkout "refs/tags/$TARGET_TAG"
          elif git rev-parse -q --verify "origin/$TARGET_TAG" >/dev/null; then
            echo "Checking out existing branch/ref: $TARGET_TAG"
            git checkout "$TARGET_TAG"
          else
            echo "Tag '$TARGET_TAG' does not exist yet; building from current ref ($EVENT_REF_NAME) and creating release tag on publish."
          fi

          COMMIT_SHA="$(git rev-parse HEAD)"
          COMMIT_BRANCH=""
          if [ "$EVENT_REF_TYPE" = "branch" ] && [ -n "$EVENT_REF_NAME" ]; then
            if git merge-base --is-ancestor "$COMMIT_SHA" "refs/remotes/origin/$EVENT_REF_NAME" 2>/dev/null || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
              COMMIT_BRANCH="$EVENT_REF_NAME"
            fi
          fi
          if [ -z "$COMMIT_BRANCH" ]; then
            DEFAULT_BRANCH="$(git symbolic-ref --short refs/remotes/origin/HEAD 2>/dev/null | sed 's|^origin/||' || true)"
            if [ -n "$DEFAULT_BRANCH" ] && git merge-base --is-ancestor "$COMMIT_SHA" "refs/remotes/origin/$DEFAULT_BRANCH" 2>/dev/null; then
              COMMIT_BRANCH="$DEFAULT_BRANCH"
            fi
          fi
          if [ -z "$COMMIT_BRANCH" ]; then
            COMMIT_BRANCH="$(git for-each-ref --contains="$COMMIT_SHA" --format='%(refname:short)' refs/remotes/origin | grep -v '^origin/HEAD$' | sed 's|^origin/||' | head -n 1 || true)"
          fi
          if [ -z "$COMMIT_BRANCH" ]; then
            COMMIT_BRANCH="main"
          fi

          echo "Resolved release build metadata: tag=$TARGET_TAG, commit_branch=$COMMIT_BRANCH, commit_sha=$COMMIT_SHA"
          echo "commit_branch=$COMMIT_BRANCH" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"
          echo "AME_BUILD_CHANNEL=release" >> "$GITHUB_ENV"
          echo "AME_GIT_BRANCH=$COMMIT_BRANCH" >> "$GITHUB_ENV"
          echo "AME_RELEASE_TAG=$TARGET_TAG" >> "$GITHUB_ENV"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android Platform SDK 37
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f -print -quit || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/tools/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          echo "Installing cmake 3.22.1..."
          "$SDKMANAGER" --install "cmake;3.22.1" > /dev/null 2>&1 || true
          if "$SDKMANAGER" --install "platforms;android-37" > /tmp/sdk.log 2>&1; then
            echo "Installed platforms;android-37 directly"
          else
            echo "Direct install of android-37 failed, trying platforms;android-37.0"
            "$SDKMANAGER" --install "platforms;android-37.0" > /tmp/sdk.log 2>&1 || {
              cat /tmp/sdk.log
              exit 1
            }
            P37="${ANDROID_HOME}/platforms/android-37"
            P370="${ANDROID_HOME}/platforms/android-37.0"
            if [ -d "$P370" ] && [ ! -d "$P37" ]; then
              cp -r "$P370" "$P37"
              sed -i 's/PlatformVersion=37\.0/PlatformVersion=37/' "$P37/source.properties" || true
              sed -i 's/AndroidVersion.ApiLevel=37\.0/AndroidVersion.ApiLevel=37/' "$P37/source.properties" || true
            fi
          fi
          ls -la "${ANDROID_HOME}/platforms/"

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run release unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Assemble universal release APKs (standard and disguised variants)
        run: |
          set -euo pipefail
          mkdir -p build-outputs

          # 1. Standard universal APK (unmasked, package: Akari.NCM.player)
          echo ">>> Building standard universal APK..."
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/*.apk build-outputs/app-release-unsigned.apk
          rm -rf app/build/outputs/apk/release/*

          # 2. Apple Music disguise (package: com.apple.android.music)
          echo ">>> Building Apple Music disguise APK..."
          ./gradlew assembleRelease -PcustomApplicationId=com.apple.android.music --no-daemon --stacktrace
          cp app/build/outputs/apk/release/*.apk build-outputs/app-Apple_Music-release-unsigned.apk
          rm -rf app/build/outputs/apk/release/*

          # 3. Spotify disguise (package: com.spotify.music)
          echo ">>> Building Spotify disguise APK..."
          ./gradlew assembleRelease -PcustomApplicationId=com.spotify.music --no-daemon --stacktrace
          cp app/build/outputs/apk/release/*.apk build-outputs/app-Spotify-release-unsigned.apk
          rm -rf app/build/outputs/apk/release/*

          # 4. NetEase Music disguise (package: com.netease.cloudmusic)
          echo ">>> Building NetEase Music disguise APK..."
          ./gradlew assembleRelease -PcustomApplicationId=com.netease.cloudmusic --no-daemon --stacktrace
          cp app/build/outputs/apk/release/*.apk build-outputs/app-Netease_Music-release-unsigned.apk
          rm -rf app/build/outputs/apk/release/*

          # Collect all universal APKs
          cp build-outputs/*.apk app/build/outputs/apk/release/
          ls -lh app/build/outputs/apk/release/

      - name: Verify universal release APKs exist
        run: |
          set -euo pipefail
          ls -lh app/build/outputs/apk/release/
          test -f app/build/outputs/apk/release/app-release-unsigned.apk
          test -f app/build/outputs/apk/release/app-Apple_Music-release-unsigned.apk
          test -f app/build/outputs/apk/release/app-Spotify-release-unsigned.apk
          test -f app/build/outputs/apk/release/app-Netease_Music-release-unsigned.apk

      - name: Prepare private signing key
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Missing SIGNING_KEYSTORE_BASE64 repository/environment secret"
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/ame-player-signing.p12"
          test -s "$RUNNER_TEMP/ame-player-signing.p12"
          : "${STORE_PASSWORD:?Missing SIGNING_STORE_PASSWORD secret}"
          : "${KEY_ALIAS:?Missing SIGNING_KEY_ALIAS secret}"
          keytool -list -storetype PKCS12 -keystore "$RUNNER_TEMP/ame-player-signing.p12" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "KEYSTORE_PATH=$RUNNER_TEMP/ame-player-signing.p12" >> "$GITHUB_ENV"

      - name: Align, sign, verify, and checksum APKs
        env:
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          set -euo pipefail
          : "${STORE_PASSWORD:?Missing SIGNING_STORE_PASSWORD secret}"
          KEY_PASSWORD="${KEY_PASSWORD:-$STORE_PASSWORD}"
          KEY_ALIAS="${KEY_ALIAS:-key0}"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          shopt -s nullglob
          APKS=(app/build/outputs/apk/release/*.apk)
          test "${#APKS[@]}" -gt 0
          mkdir -p dist
          : > dist/SHA256SUMS.txt
          for APK in "${APKS[@]}"; do
            BASENAME="$(basename "$APK")"
            if [ "$BASENAME" = "app-release-unsigned.apk" ]; then
              SIGNED_NAME="Ame-Player-${{ steps.ref.outputs.safe_tag }}-signed.apk"
            elif [ "$BASENAME" = "app-Apple_Music-release-unsigned.apk" ]; then
              SIGNED_NAME="Ame-Player-${{ steps.ref.outputs.safe_tag }}-Apple_Music-signed.apk"
            elif [ "$BASENAME" = "app-Spotify-release-unsigned.apk" ]; then
              SIGNED_NAME="Ame-Player-${{ steps.ref.outputs.safe_tag }}-Spotify-signed.apk"
            elif [ "$BASENAME" = "app-Netease_Music-release-unsigned.apk" ]; then
              SIGNED_NAME="Ame-Player-${{ steps.ref.outputs.safe_tag }}-Netease_Music-signed.apk"
            else
              VARIANT="${BASENAME#app-}"
              VARIANT="${VARIANT%-unsigned.apk}"
              VARIANT="${VARIANT%.apk}"
              SIGNED_NAME="Ame-Player-${{ steps.ref.outputs.safe_tag }}-${VARIANT}-signed.apk"
            fi
            ALIGNED="dist/aligned-temp.apk"
            SIGNED="dist/${SIGNED_NAME}"
            "$BUILD_TOOLS/zipalign" -f -p 4 "$APK" "$ALIGNED"
            "$BUILD_TOOLS/apksigner" sign \
              --ks "$KEYSTORE_PATH" \
              --ks-type PKCS12 \
              --ks-pass env:STORE_PASSWORD \
              --key-pass env:KEY_PASSWORD \
              --ks-key-alias "$KEY_ALIAS" \
              --out "$SIGNED" "$ALIGNED"
            "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$SIGNED"
            rm -f "$ALIGNED"
            (cd dist && sha256sum "$SIGNED_NAME" | tee -a SHA256SUMS.txt)
          done

      - name: Upload signed APK - Standard (Akari.NCM.player)
        uses: actions/upload-artifact@v4
        with:
          name: Ame-Player-${{ steps.ref.outputs.safe_tag }}-Standard-signed
          path: dist/Ame-Player-${{ steps.ref.outputs.safe_tag }}-signed.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload signed APK - Apple Music Disguise (com.apple.android.music)
        uses: actions/upload-artifact@v4
        with:
          name: Ame-Player-${{ steps.ref.outputs.safe_tag }}-Apple_Music-signed
          path: dist/Ame-Player-${{ steps.ref.outputs.safe_tag }}-Apple_Music-signed.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload signed APK - Spotify Disguise (com.spotify.music)
        uses: actions/upload-artifact@v4
        with:
          name: Ame-Player-${{ steps.ref.outputs.safe_tag }}-Spotify-signed
          path: dist/Ame-Player-${{ steps.ref.outputs.safe_tag }}-Spotify-signed.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload signed APK - NetEase Music Disguise (com.netease.cloudmusic)
        uses: actions/upload-artifact@v4
        with:
          name: Ame-Player-${{ steps.ref.outputs.safe_tag }}-Netease_Music-signed
          path: dist/Ame-Player-${{ steps.ref.outputs.safe_tag }}-Netease_Music-signed.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload SHA256SUMS
        uses: actions/upload-artifact@v4
        with:
          name: Ame-Player-${{ steps.ref.outputs.safe_tag }}-SHA256SUMS
          path: dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90

      - name: Remove temporary keystore
        if: always()
        run: rm -f "${{ runner.temp }}/ame-player-signing.p12"

  publish:
    name: Publish GitHub Release
    needs: build-sign
    runs-on: [self-hosted, android-builder]
    permissions:
      contents: write
    steps:
      - name: Download signed APK artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: Ame-Player-${{ needs.build-sign.outputs.safe_tag }}-*
          merge-multiple: true
          path: dist

      - name: Check existing release and prepare tag
        id: existing_release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build-sign.outputs.tag }}
          COMMIT_BRANCH: ${{ needs.build-sign.outputs.commit_branch }}
          COMMIT_SHA: ${{ needs.build-sign.outputs.commit_sha }}
          PRESERVE_NOTES: ${{ inputs.preserve_release_notes }}
        run: |
          set -euo pipefail
          HTTP_CODE="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}")"

          if [ "$HTTP_CODE" = "200" ]; then
            echo "Existing release found for tag '$TAG'; preserving tag and overwriting assets."
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "target_commitish=" >> "$GITHUB_OUTPUT"
            if [ "$PRESERVE_NOTES" = "false" ]; then
              echo "generate_notes=true" >> "$GITHUB_OUTPUT"
            else
              echo "generate_notes=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "No existing release for tag '$TAG' (HTTP $HTTP_CODE); creating new release."
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "target_commitish=$COMMIT_BRANCH" >> "$GITHUB_OUTPUT"
            echo "generate_notes=true" >> "$GITHUB_OUTPUT"

            TAG_HTTP="$(curl -sS -o /dev/null -w '%{http_code}' \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}")"
            if [ "$TAG_HTTP" != "200" ] && [ -n "$COMMIT_SHA" ]; then
              echo "Pinning new tag '$TAG' to built commit $COMMIT_SHA..."
              curl -fsS -X POST \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer $GH_TOKEN" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs" \
                -d "{\"ref\":\"refs/tags/${TAG}\",\"sha\":\"${COMMIT_SHA}\"}" >/dev/null
            fi
          fi

      - name: Publish release and signed APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-sign.outputs.tag }}
          name: Ame-Player ${{ needs.build-sign.outputs.tag }}
          target_commitish: ${{ steps.existing_release.outputs.target_commitish }}
          generate_release_notes: ${{ steps.existing_release.outputs.generate_notes == 'true' }}
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt

  cleanup-cache:
    name: Clean up InstaBox build cache
    needs: [build-sign, publish]
    if: always()
    runs-on: [self-hosted, android-builder]
    steps:
      - name: Clean build caches and temporary workspace outputs
        continue-on-error: true
        run: |
          echo ">>> Disk usage before cleanup:"
          df -h . "$HOME" || true
          rm -rf \
            "$GITHUB_WORKSPACE/.gradle" \
            "$GITHUB_WORKSPACE/build" \
            "$GITHUB_WORKSPACE"/*/build \
            "$GITHUB_WORKSPACE/build-outputs" \
            "$GITHUB_WORKSPACE/dist" \
            "$GITHUB_WORKSPACE/unsigned" \
            "$GITHUB_WORKSPACE/signed" \
            "$HOME/.gradle/caches/build-cache-"* \
            "$HOME/.gradle/caches/transforms-"* \
            "$HOME/.gradle/caches/journal-"* \
            "$HOME/.gradle/caches/8."* \
            "$HOME/.gradle/caches/9."* \
            "$HOME/.gradle/daemon" \
            "$HOME/.gradle/tmp" \
            "$HOME/.android/build-cache" \
            "${TMPDIR:-/tmp}"/gradle* \
            "${TMPDIR:-/tmp}"/kotlin* \
            "$RUNNER_TEMP/"* \
            /tmp/gradle* /tmp/kotlin* /tmp/sdk.log 2>/dev/null || true
          echo ">>> Disk usage after cleanup:"
          df -h . "$HOME" || true