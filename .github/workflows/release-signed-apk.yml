name: Publish Signed APK Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing version tag to build and publish (for example v1.0.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-sign:
    name: Build and sign release APK
    outputs:
      tag: ${{ steps.ref.outputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - name: Select release ref
        id: ref
        env:
          INPUT_TAG: ${{ inputs.tag_name }}
          EVENT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="${EVENT_REF#refs/tags/}"
          fi
          if [[ ! "$TAG" =~ ^v[0-9][0-9A-Za-z._-]*$ ]]; then
            echo "::error::Tag must start with v and contain a valid version"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.tag }}
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android Platform SDK 37
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f -print -quit || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/tools/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          if "$SDKMANAGER" --install "platforms;android-37" > /tmp/sdk.log 2>&1; then
            echo "Installed platforms;android-37 directly"
          else
            echo "Direct install of android-37 failed, trying platforms;android-37.0"
            "$SDKMANAGER" --install "platforms;android-37.0" > /tmp/sdk.log 2>&1 || {
              cat /tmp/sdk.log
              exit 1
            }
            P37="${ANDROID_HOME}/platforms/android-37"
            P370="${ANDROID_HOME}/platforms/android-37.0"
            if [ -d "$P370" ] && [ ! -d "$P37" ]; then
              cp -r "$P370" "$P37"
              sed -i 's/PlatformVersion=37\.0/PlatformVersion=37/' "$P37/source.properties" || true
              sed -i 's/AndroidVersion.ApiLevel=37\.0/AndroidVersion.ApiLevel=37/' "$P37/source.properties" || true
            fi
          fi
          ls -la "${ANDROID_HOME}/platforms/"

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run release unit tests
        run: ./gradlew :app:testReleaseUnitTest --no-daemon --stacktrace

      - name: Assemble release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Prepare private signing key
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Missing SIGNING_KEYSTORE_BASE64 repository/environment secret"
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/ame-player-signing.p12"
          test -s "$RUNNER_TEMP/ame-player-signing.p12"
          : "${STORE_PASSWORD:?Missing SIGNING_STORE_PASSWORD secret}"
          : "${KEY_ALIAS:?Missing SIGNING_KEY_ALIAS secret}"
          keytool -list -storetype PKCS12 -keystore "$RUNNER_TEMP/ame-player-signing.p12" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "KEYSTORE_PATH=$RUNNER_TEMP/ame-player-signing.p12" >> "$GITHUB_ENV"

      - name: Align, sign, verify, and checksum
        env:
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          set -euo pipefail
          : "${STORE_PASSWORD:?Missing SIGNING_STORE_PASSWORD secret}"
          KEY_PASSWORD="${KEY_PASSWORD:-$STORE_PASSWORD}"
          KEY_ALIAS="${KEY_ALIAS:-key0}"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          APK="$(find app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          mkdir -p dist
          ALIGNED="dist/ame-player-release-aligned.apk"
          SIGNED="dist/Ame-Player-${{ steps.ref.outputs.tag }}-signed.apk"
          "$BUILD_TOOLS/zipalign" -f -p 4 "$APK" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-type PKCS12 \
            --ks-pass env:STORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" \
            --out "$SIGNED" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$SIGNED"
          sha256sum "$SIGNED" > dist/SHA256SUMS.txt
          rm -f "$ALIGNED"

      - name: Upload signed APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ame-player-${{ steps.ref.outputs.tag }}-signed
          path: dist/*
          if-no-files-found: error
          retention-days: 90

      - name: Remove temporary keystore
        if: always()
        run: rm -f "${{ runner.temp }}/ame-player-signing.p12"

  publish:
    name: Publish GitHub Release
    needs: build-sign
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download signed APK artifacts
        uses: actions/download-artifact@v4
        with:
          name: ame-player-${{ needs.build-sign.outputs.tag }}-signed
          path: dist

      - name: Publish release and signed APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          name: Ame-Player ${{ inputs.tag_name || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
